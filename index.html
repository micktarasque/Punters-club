<!doctype html>
<html lang="en" style="background-color:#0B110E;color:#F3F4F0;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TurfSheet" />
    <meta name="theme-color" content="#0B110E" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>TurfSheet NSW — TAB Racing & Betting Ledger</title>
    <meta name="description" content="Smart horse racing form guide, NSW TAB results scraper, exotic dividend calculator, and interactive betting sheet." />
    <meta property="og:title" content="TurfSheet NSW — TAB Racing & Betting Ledger" />
    <meta property="og:description" content="Smart horse racing form guide, NSW TAB results scraper, exotic dividend calculator, and interactive betting sheet." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: #0B110E;
        color: #F3F4F0;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .ts-boot-shell {
        max-width: 980px;
        margin: 0 auto;
        padding: 28px 18px;
      }
      .ts-boot-card {
        background: #111C16;
        border: 1px solid #23352C;
        border-radius: 14px;
        padding: 24px;
      }
      .ts-boot-title {
        margin: 12px 0 6px;
        font-size: 26px;
        font-weight: 700;
        color: #F3F4F0;
      }
      .ts-boot-sub {
        margin: 0;
        font-size: 14px;
        color: #9BA8A1;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ts-boot-shell">
        <div class="ts-boot-card">
          <h1 class="ts-boot-title">TurfSheet - Punters club</h1>
          <p class="ts-boot-sub" id="ts-boot-status">
            Loading racecards, selections &amp; results...
          </p>
        </div>
      </div>
    </div>
    <script>
      (function() {
        try {
          if ((location.protocol === "http:" || location.protocol === "https:") && "serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          }
          if ("caches" in window) {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) {
                caches.delete(keys[i]);
              }
            }).catch(function() {});
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
