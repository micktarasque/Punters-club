<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TurfSheet" />
    <meta name="theme-color" content="#070B09" id="meta-theme-color" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>TurfSheet — Racing Intelligence &amp; Syndicate Ledger</title>
    <meta name="description" content="Precision horse racing form guide, syndicate selections ledger, and live TAB dividend scoring." />
    <meta property="og:title" content="TurfSheet — Racing Intelligence &amp; Syndicate Ledger" />
    <meta property="og:description" content="Precision horse racing form guide, syndicate selections ledger, and live TAB dividend scoring." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem("turfsheet_theme_scheme_v1");
          var theme = (t === "apple") ? "apple" : "default";
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "apple") {
            document.documentElement.classList.add("theme-apple");
            var meta = document.getElementById("meta-theme-color");
            if (meta) meta.setAttribute("content", "#F5F5F7");
          } else {
            document.documentElement.classList.add("theme-turf");
          }
        } catch(e) {}
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: #070B09;
        color: #F3F4F0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html[data-theme="apple"], body[data-theme="apple"] {
        background-color: #F5F5F7;
        color: #1D1D1F;
      }
      .ts-boot-shell {
        max-width: 800px;
        margin: 80px auto;
        padding: 32px 24px;
        text-align: center;
      }
      .ts-boot-card {
        background: #0E1512;
        border: 1px solid #1F2D26;
        border-radius: 20px;
        padding: 40px 32px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      }
      html[data-theme="apple"] .ts-boot-card {
        background: #FFFFFF;
        border: 1px solid #E5E5EA;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      }
      .ts-boot-title {
        margin: 0 0 10px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #F3F4F0;
      }
      html[data-theme="apple"] .ts-boot-title {
        color: #1D1D1F;
      }
      .ts-boot-sub {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
        color: #8A9990;
      }
      html[data-theme="apple"] .ts-boot-sub {
        color: #86868B;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ts-boot-shell">
        <div class="ts-boot-card">
          <h1 class="ts-boot-title">TurfSheet Punters Club</h1>
          <p class="ts-boot-sub" id="ts-boot-status">
            Loading racecards, member selections &amp; live results...
          </p>
        </div>
      </div>
    </div>
    <script>
      (function() {
        try {
          if ((location.protocol === "http:" || location.protocol === "https:") && "serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          }
          if ("caches" in window) {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) {
                caches.delete(keys[i]);
              }
            }).catch(function() {});
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
